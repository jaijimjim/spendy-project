name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Same gates as PRs: any failing step blocks deployment (OMX-028 AC1).
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    needs: ci
    # workflow_dispatch may target any branch (e.g. the OMX-028 AC1 failing-gate proof): CI still
    # runs there, but only main may build/deploy Pages. `needs: ci` keeps the implicit success().
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Repository variable (preferred) or secret; empty ⇒ "Google Photos not configured" state.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
