name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        # OMX-028 AC3: the build must succeed with and without a Google Client ID.
        variant: [without-google, with-google]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ matrix.variant == 'with-google' && 'ci-dummy.apps.googleusercontent.com' || '' }}
      - run: npm run size:check
      - name: Tesseract assets are bundled from npm (no CDN)
        run: |
          test -f dist/tesseract/worker.min.js
          test -f dist/tesseract/lang/tha.traineddata.gz
          test -f dist/tesseract/lang/eng.traineddata.gz
          ! grep -rE "cdn\.jsdelivr|unpkg\.com|fonts\.googleapis" dist/assets/*.js
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'without-google'
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=mobile --project=desktop --project=real-ocr
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
