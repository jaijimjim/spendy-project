<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spendy Sprint 2 Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work — a team's physical Scrum wall, made exact
   IDEA the cork-free wall in the team room: sprint goal strip on top, swim columns of index cards
   PICTURE the board itself, full width, cards with epic tab, points chip and owner
   COLOUR Spendy tokens: indigo #4433C4 strip, white cards on #F5F6FA, honey #F5B94A for the goal mark; night #0E1120
   TYPE IBM Plex Sans Thai (the app's own face)
   LAYOUT goal strip + capacity meter, filter row, six columns (scroll sideways under 1100px, one snap column per screen on phone) */
:root{color-scheme:light dark;
--bg:light-dark(#F5F6FA,#0E1120);--sf:light-dark(#FFFFFF,#161A2C);--col:light-dark(#EBEDF4,#121628);
--ink:light-dark(#151A28,#ECEEF7);--mut:light-dark(#4F566B,#AAB0C6);--sub:light-dark(#6B7186,#8D94AD);
--line:light-dark(#DADDE8,#2A3048);--pri:light-dark(#4433C4,#A9B1FF);--onp:light-dark(#FFFFFF,#14123A);
--pris:light-dark(#ECEAFD,#262A55);--prit:light-dark(#3A2BB0,#C3C8FF);--acc:#F5B94A;
--ok:light-dark(#03754F,#5FD4A4);--oks:light-dark(#E2F5EC,#12302A);--warn:light-dark(#9A4A00,#FFB561);--warns:light-dark(#FFF3D6,#3A2A12);
--bad:light-dark(#B42318,#FF8A80);--bads:light-dark(#FDE8E6,#3D1A1A)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
.top{background:var(--pri);color:var(--onp);padding:20px max(3vw,16px) 18px}
.top h1{margin:0;font-size:clamp(26px,3.4vw,38px);line-height:1.08;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.toprow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end;margin-top:10px}
.goal{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:16px;max-width:70ch}
.goal svg{flex:none;margin-top:3px}
.cap{background:color-mix(in srgb,var(--onp) 12%,transparent);border-radius:12px;padding:12px 14px}
.capt{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.capt b{font-size:22px;font-variant-numeric:tabular-nums}
.meter{position:relative;height:14px;border-radius:7px;background:color-mix(in srgb,var(--onp) 22%,transparent);margin:8px 0 6px;overflow:hidden}
.meter span{position:absolute;inset-block:0;left:0}
.m-done{background:var(--acc)}.m-act{background:color-mix(in srgb,var(--acc) 55%,var(--onp))}
.mline{position:absolute;inset-block:-3px;width:2px;background:var(--onp)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;opacity:.92}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--sf)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:4px 12px;border-radius:18px;border:1px solid var(--line);background:var(--sf);cursor:pointer}
.chip[aria-pressed=true]{background:var(--pris);color:var(--prit);border-color:var(--pri);font-weight:600}
.bar input[type=search],.bar select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 10px;font-size:16px}
.bar input[type=search]{width:min(240px,100%)}
.bar input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.bar label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut)}
.ghost{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(218px,1fr);gap:12px;padding:16px max(3vw,16px) 28px;overflow-x:auto;scroll-snap-type:x proximity;align-items:start}
.col{background:var(--col);border-radius:14px;padding:10px;scroll-snap-align:start;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--pri);outline-offset:-2px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 4px}
.ch h2{margin:0;font-size:15px;font-weight:700}
.ch small{color:var(--mut);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch p{margin:0;font-size:13px;color:var(--sub);flex-basis:100%}
.ch{flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:9px 10px 8px;cursor:grab;display:grid;gap:5px}
.card:active{cursor:grabbing}.card.drag{opacity:.45}
.card.hi{border-left:4px solid var(--bad)}
.card.blk{background:linear-gradient(var(--sf),var(--sf)) padding-box,repeating-linear-gradient(45deg,var(--warn) 0 6px,transparent 6px 12px) border-box;border:2px solid transparent}
.r1{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut)}
.r1 .ep{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id{flex:none;white-space:nowrap;font-weight:600;color:var(--prit)}
.pts{flex:none;margin-left:auto;min-width:26px;height:24px;border-radius:12px;background:var(--pris);color:var(--prit);font-weight:700;display:grid;place-items:center;padding:0 7px;font-size:13px}
.t{font-weight:500;line-height:1.35}
.n{font-size:13px;color:var(--mut)}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tg{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tg.must{background:var(--bads);color:var(--bad)}.tg.should{background:var(--warns);color:var(--warn)}.tg.s2{background:var(--pris);color:var(--prit)}.tg.st{background:var(--warns);color:var(--warn)}.tg.pd{background:var(--oks);color:var(--ok)}
.av{margin-left:auto;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;border:1px solid var(--line)}
.mv{justify-self:end;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;padding:2px 6px}
.group{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--sf) 60%,transparent)}
.group summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center;gap:6px}
.group[open] summary{margin-bottom:6px}
.group .card{margin-top:6px}
.empty{font-size:13px;color:var(--sub);text-align:center;padding:16px 4px}
.foot{padding:0 max(3vw,16px) 24px;color:var(--sub);font-size:13px}
@media(max-width:820px){.toprow{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.board{grid-auto-columns:86%;scroll-snap-type:x mandatory}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-1px);box-shadow:0 4px 10px color-mix(in srgb,var(--ink) 10%,transparent)}}
</style>
</head>
